<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JourneyOps 交互式决策演示</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#68738a;
  --line:#e3e7ee; --accent:#2c5fd8; --ok:#177a4c; --bad:#b13131;
  --warn:#9a6a00; --chip:#eef1f6;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12151c; --panel:#1a1f29; --ink:#e8ecf4; --muted:#93a0b7;
        --line:#2a3242; --accent:#7aa2ff; --ok:#5ecf9a; --bad:#ff8a8a;
        --warn:#ffd479; --chip:#242b39;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px 20px 10px;border-bottom:1px solid var(--line);
       background:var(--panel)}
header h1{margin:0 0 6px;font-size:19px}
.banner{font-size:12.5px;color:var(--muted)}
.banner b{color:var(--warn)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;
      border-bottom:1px solid var(--line);background:var(--panel)}
.tab{border:1px solid var(--line);background:var(--chip);color:var(--ink);
     border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.tab .prov{display:block;font-size:11px;color:var(--muted)}
.tab.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
     gap:14px;padding:14px 20px;max-width:1280px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card h2{margin:0;padding:10px 14px;font-size:13px;color:var(--muted);
         border-bottom:1px solid var(--line);letter-spacing:.4px}
#feed{min-height:420px;max-height:64vh;overflow-y:auto;padding:12px 14px}
.ev{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg)}
.ev .who{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.ev .t{font-weight:650}
.ev .b{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.ev.user{border-left:3px solid var(--accent)}
.ev.verifier.rejected{border-left:3px solid var(--bad)}
.ev.verifier.verified{border-left:3px solid var(--ok)}
.ev.worker{border-left:3px solid var(--warn)}
.ev.system{border-left:3px solid var(--muted)}
.ev.agent{border-left:3px solid #8a6fd8}
.kv{margin:8px 0 0;font-size:12.8px;border-top:1px dashed var(--line);
    padding-top:6px}
.kv table{border-collapse:collapse;width:100%}
.kv td{padding:2px 8px 2px 0;vertical-align:top}
.kv td:first-child{color:var(--muted);white-space:nowrap;width:1%}
.kv code,.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
.src{display:inline-block;margin-top:7px;font-size:11px;color:var(--muted);
     background:var(--chip);border-radius:6px;padding:2px 7px}
.right{display:flex;flex-direction:column;gap:14px}
#rail{padding:10px 14px}
.stage{display:flex;align-items:center;gap:8px;padding:4px 0;
       font-size:13px;color:var(--muted)}
.stage .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.stage.hit{color:var(--ink)}
.stage.hit .dot{background:var(--muted)}
.stage.now{color:var(--accent);font-weight:650}
.stage.now .dot{background:var(--accent)}
#auth{padding:12px 14px;font-size:13.5px}
#auth .row{display:flex;justify-content:space-between;gap:10px;
           padding:3px 0;border-bottom:1px dashed var(--line)}
#auth .row span:first-child{color:var(--muted)}
#auth table{border-collapse:collapse;width:100%;margin-top:8px;font-size:12.3px}
#auth th,#auth td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
#auth th{color:var(--muted);font-weight:500}
.money{display:flex;gap:10px;margin-top:9px;flex-wrap:wrap}
.money .m{background:var(--chip);border-radius:8px;padding:6px 10px;
          font-size:12.5px}
.money .m b{display:block;font-size:15px}
.ctrl{display:flex;gap:8px;align-items:center;padding:12px 20px;
      border-top:1px solid var(--line);background:var(--panel);
      position:sticky;bottom:0;flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:var(--chip);
      color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;
      font-size:13.5px}
.ctrl button.primary{border-color:var(--accent);color:var(--accent)}
.ctrl .prog{color:var(--muted);font-size:12.5px;margin-left:auto}
.foot{padding:10px 20px 26px;max-width:1280px;margin:0 auto;
      font-size:12.5px;color:var(--muted)}
.foot .stats{color:var(--ink);background:var(--panel);
      border:1px solid var(--line);border-radius:10px;padding:10px 12px;
      margin-bottom:8px}
.state-PENDING{color:var(--muted)} .state-RUNNING{color:var(--warn)}
.state-SUCCEEDED{color:var(--ok)} .state-UNKNOWN,.state-FAILED_PERMANENT{color:var(--bad)}
.state-SUSPENDED,.state-CANCELLED{color:var(--muted)}
kbd{background:var(--chip);border:1px solid var(--line);border-radius:4px;
    padding:0 5px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="banner" id="banner"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main>
  <section class="card">
    <h2>对话与事实流(逐事件回放)</h2>
    <div id="feed"></div>
  </section>
  <aside class="right">
    <section class="card"><h2>Agent 决策循环</h2><div id="rail"></div></section>
    <section class="card"><h2>系统权威状态(权威库真实字段)</h2>
      <div id="auth"></div></section>
  </aside>
</main>
<div class="ctrl">
  <button id="reset">⏮ 重置</button>
  <button id="prev">◀ 上一步</button>
  <button id="play" class="primary">▶ 播放</button>
  <button id="next">下一步 ▶</button>
  <label style="font-size:12.5px;color:var(--muted)">速度
    <select id="speed"><option value="1">×1</option>
      <option value="1.5">×1.5</option><option value="2">×2</option></select>
  </label>
  <span style="font-size:11.5px;color:var(--muted)">
    键盘:<kbd>←</kbd><kbd>→</kbd> 单步,<kbd>空格</kbd> 播放/暂停</span>
  <span class="prog" id="prog"></span>
</div>
<div class="foot" id="foot"></div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("DEMO_DATA").textContent);
const STAGES = [["goal","理解目标"],["query","查询取证"],
  ["evidence","读取权威证据"],["candidate","提出候选"],
  ["verdict","Verifier 裁决"],["awaiting","等待用户"],
  ["proposal","Proposal 装配"],["confirm","确认门"],
  ["execute","Worker 执行"],["reconcile","对账"],["terminal","终态"]];
const ACTOR = {user:"用户", agent:"模型(Planner)", system:"系统(后端)",
  verifier:"Verifier", worker:"Worker", supplier:"外部世界", controller:"用户"};
const KIND_LABEL = {recorded_model_trace:"真实模型轨迹",
  deterministic_sandbox:"确定性沙箱",
  scripted_planner_real_adjudication:"脚本 planner + 真实裁决"};
let chIdx = 0, pos = 0, timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                          .replace(/>/g,"&gt;");
function fmtVal(v){
  if (v === true) return "✓ 是"; if (v === false) return "✗ 否";
  if (v === null || v === undefined) return "—";
  if (Array.isArray(v)) return esc(v.map(x =>
    typeof x === "object" ? JSON.stringify(x) : x).join("、"));
  if (typeof v === "object")
    return Object.entries(v).map(([k,x]) =>
      `<div><code>${esc(k)}</code> ${fmtVal(x)}</div>`).join("");
  if (typeof v === "string" && /^[A-Za-z0-9_:\-\.\/›‹]+$/.test(v) && v.length > 14)
    return `<code>${esc(v)}</code>`;
  return esc(v);
}
function evHtml(e){
  let kv = "";
  const entries = Object.entries(e.data || {});
  if (entries.length){
    kv = `<div class="kv"><table>` + entries.map(([k,v]) =>
      `<tr><td>${esc(k)}</td><td>${fmtVal(v)}</td></tr>`).join("") +
      `</table></div>`;
  }
  const src = e.source ? `<span class="src">来源:${esc(e.source.label)}` +
    (e.source.file ? ` · <span class="mono">${esc(e.source.file)}</span>` : "") +
    `</span>` : "";
  return `<div class="ev ${e.actor} ${e.type}">
    <div class="who">${ACTOR[e.actor] || e.actor} · 第 ${e.seq} 步</div>
    <div class="t">${esc(e.title)}</div>
    ${e.body ? `<div class="b">${esc(e.body)}</div>` : ""}
    ${kv}${src}</div>`;
}
function renderRail(cur){
  const seen = new Set(DATA.chapters[chIdx].events.slice(0, pos)
                       .map(e => e.stage));
  $("rail").innerHTML = STAGES.map(([k, label]) => {
    const cls = k === cur ? "stage now" : (seen.has(k) ? "stage hit" : "stage");
    return `<div class="${cls}"><span class="dot"></span>${label}</div>`;
  }).join("");
}
function renderAuth(){
  const evs = DATA.chapters[chIdx].events.slice(0, pos);
  let s = null;
  for (const e of evs) if (e.authoritative) s = e.authoritative;
  if (!s){ $("auth").innerHTML =
    `<span style="color:var(--muted)">(本章此刻无权威快照——规划期轨迹回放)</span>`;
    return; }
  const rows = [
    ["计划状态", `<b>${esc(s.plan_status)}</b>`],
    ["Goal revision", s.goal_revision],
    ["Proposal", s.proposal ?
      `<code>${esc(s.proposal.id.slice(0,14))}…</code> ${esc(s.proposal.state)}` : "—"],
    ["执行命令数", s.commands.length],
    ["供应商调用数", s.supplier_calls],
  ].map(([k,v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`)
   .join("");
  let cmds = "";
  if (s.commands.length){
    cmds = `<table><tr><th>步骤</th><th>工具</th><th>状态</th><th>幂等键</th></tr>` +
      s.commands.map(c => `<tr><td>${esc(c.step_id)}</td><td>${esc(c.tool)}</td>
        <td class="state-${esc(c.state)}">${esc(c.state)}</td>
        <td><code>${esc(c.idempotency_key.slice(0,14))}…</code></td></tr>`)
        .join("") + `</table>`;
  }
  let money = "";
  if (s.money){
    money = `<div class="money">` + Object.entries(s.money).map(([k,v]) =>
      `<div class="m">${esc(k)}<b>¥${esc(v)}</b></div>`).join("") + `</div>`;
  }
  $("auth").innerHTML = rows + cmds + money;
}
function renderFoot(){
  const ch = DATA.chapters[chIdx];
  let html = "";
  if (ch.stats){
    html += `<div class="stats"><b>真实模型定向验证:</b> ` +
      Object.entries(ch.stats).filter(([k]) => k !== "口径")
        .map(([k,v]) => `${esc(k)} <b>${esc(v)}</b>`).join(" · ") +
      `<br><span style="color:var(--muted)">${esc(ch.stats["口径"])}</span></div>`;
  }
  const p = ch.provenance;
  html += `<div><b>本章数据来源:</b>${esc(p.label)}。${esc(p.note)}` +
    (p.files || []).map(f =>
      `<br><span class="mono">${esc(f.path)} · sha256 ${esc(f.sha256.slice(0,16))}…</span>`)
      .join("") + `</div>`;
  $("foot").innerHTML = html;
}
function render(){
  const ch = DATA.chapters[chIdx];
  const evs = ch.events.slice(0, pos);
  $("feed").innerHTML = evs.map(evHtml).join("") ||
    `<span style="color:var(--muted)">按「播放」或「下一步」开始。</span>`;
  $("feed").scrollTop = $("feed").scrollHeight;
  renderRail(evs.length ? evs[evs.length-1].stage : null);
  renderAuth(); renderFoot();
  $("prog").textContent = `${ch.id} · ${ch.title} — ${pos}/${ch.events.length}`;
  document.querySelectorAll(".tab").forEach((t,i) =>
    t.classList.toggle("on", i === chIdx));
}
function dwell(e){
  const base = {verdict:2600, awaiting:2600, terminal:2300}[e.stage] || 1500;
  return base / parseFloat($("speed").value);
}
function stop(){ if (timer){ clearTimeout(timer); timer = null; }
  $("play").textContent = "▶ 播放"; }
function step(d){
  const n = DATA.chapters[chIdx].events.length;
  pos = Math.max(0, Math.min(n, pos + d)); render();
}
function playLoop(){
  const n = DATA.chapters[chIdx].events.length;
  if (pos >= n){ stop(); return; }
  step(1);
  const e = DATA.chapters[chIdx].events[pos-1];
  timer = setTimeout(playLoop, dwell(e));
}
$("play").onclick = () => { if (timer){ stop(); }
  else { $("play").textContent = "⏸ 暂停"; playLoop(); } };
$("next").onclick = () => { stop(); step(1); };
$("prev").onclick = () => { stop(); step(-1); };
$("reset").onclick = () => { stop(); pos = 0; render(); };
document.addEventListener("keydown", ev => {
  if (ev.key === "ArrowRight"){ stop(); step(1); }
  else if (ev.key === "ArrowLeft"){ stop(); step(-1); }
  else if (ev.key === " "){ ev.preventDefault(); $("play").onclick(); }
});
$("title").textContent = DATA.title + " —— " + DATA.principle;
$("banner").innerHTML = "<b>录制沙箱回放 · 非生产系统</b> · " +
  esc(DATA.banner.replace(/^录制沙箱回放 · 非生产系统 —— /, ""));
$("tabs").innerHTML = DATA.chapters.map((ch,i) =>
  `<button class="tab" data-i="${i}">${ch.id} · ${esc(ch.title)}
     <span class="prov">${KIND_LABEL[ch.provenance.kind] || ""} · ${esc(ch.tagline)}</span>
   </button>`).join("");
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  stop(); chIdx = +t.dataset.i; pos = 0; render();
});
render();
</script>
</body>
</html>
